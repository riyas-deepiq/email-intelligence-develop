# Shared by every proxied location. Copied into the image as
# /etc/nginx/insight-hub-proxy-headers.conf — no substitution, so it is a plain file.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# APPENDS the real peer address rather than replacing the header, so a spoofed
# X-Forwarded-For from a client can never be the LAST entry — and the last entry
# is the one Express reads under `trust proxy: 1` (server/src/app.ts:35). Without
# a proxy in front, that setting lets any caller forge req.ip and slip past the
# auth rate limiters; with this line it cannot.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket/upgrade passthrough. $connection_upgrade maps to an empty string for
# ordinary requests, which drops the Connection header and lets the upstream
# keepalive pool actually be reused.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Fail fast on a dead app rather than holding the browser for a minute.
proxy_connect_timeout 5s;
