name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR title/branch name only need checking when the PR is raised, its
  # title/description is edited, or it's reopened — not on every commit push.
  validate-pr-title:
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits (feat/fix require an issue ref)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix)(\([a-z0-9-]+\))?:\ (.+)$ ]]; then
            rest="${BASH_REMATCH[3]}"
            if [[ ! "$rest" =~ ^.+\ \[#[0-9]+\]$ ]]; then
              echo "::error::PR title '$PR_TITLE' is missing an issue reference."
              echo "Expected: feat|fix(optional-scope): <description> [#<issue-number>]"
              echo "Example: feat: add individual account type [#123]"
              exit 1
            fi
          elif [[ "$PR_TITLE" =~ ^(chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9-]+\))?:\ .+$ ]]; then
            : # no issue reference required for these types
          else
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits format."
            echo "Expected: <type>(optional-scope): <description>"
            echo "feat/fix additionally require an issue reference: feat: add thing [#123]"
            echo "Allowed types: feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"

  validate-branch-name:
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|chore|hotfix|docs|style|refactor|perf|test|build|ci|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow the required convention."
            echo "Expected: <type>/<short-description>"
            echo "Example: feat/individual-onboarding"
            echo "Allowed types: feat, fix, chore, hotfix, docs, style, refactor, perf, test, build, ci, revert"
            exit 1
          fi
          echo "Branch name OK: $BRANCH_NAME"

  # # Code-quality gate: lint/typecheck/test/build. Runs on every push to the
  # # PR (unlike the naming checks above), since code correctness needs
